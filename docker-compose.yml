version: '3.8'

services:
  timenest-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timenest-platform
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://timenest-db:3306/timenest_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=timenest_user
      - SPRING_DATASOURCE_PASSWORD=timenest_secret
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MySQLDialect
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      timenest-db:
        condition: service_healthy
    networks:
      - timenest-net

  timenest-db:
    image: mysql:8.0
    container_name: timenest-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: timenest_db
      MYSQL_USER: timenest_user
      MYSQL_PASSWORD: timenest_secret
      MYSQL_ROOT_PASSWORD: root_master_password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "timenest_user", "-ptimenest_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - timenest-net

volumes:
  db_data:
    driver: local

networks:
  timenest-net:
    driver: bridge
