<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Appointments - Log In</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@latest"></script>
    <style>
      /* Custom CSS for the logo and header */
      .logo-icon {
        width: 40px;
        height: 40px;
        margin-right: 10px;
      }
      .header-title {
        font-size: 24px;
        font-weight: 600;
      }
      /* Notification styles */
      #notification {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #4caf50;
        color: white;
        padding: 15px 20px;
        border-radius: 5px;
        z-index: 1000;
        opacity: 0;
        transition: opacity 0.3s ease-in-out;
      }
      #notification.show {
        opacity: 1;
      }
    </style>
  </head>
  <body
    class="bg-gradient-to-tl from-purple-400 to-pink-300 min-h-screen flex items-center justify-center"
  >
    <div id="notification">Login successful! Redirecting to main page...</div>
    <div
      class="bg-white bg-opacity-90 rounded-lg shadow-xl p-8 max-w-md w-full"
    >
      <div class="flex items-center justify-center mb-6">
        <img
          src="https://placehold.co/40x40/E07AED/ffffff?text=H&font=Montserrat"
          alt="Hyper Appointments Logo"
          class="logo-icon rounded-full"
        />
        <h1 class="header-title text-gray-800">Log In</h1>
      </div>

      <form class="space-y-4" id="login-form">
        <div>
          <label for="email" class="block text-gray-700 text-sm font-bold mb-2"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            placeholder="Your email"
            required
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-gray-700 text-sm font-bold mb-2"
            >Password</label
          >
          <input
            type="password"
            id="password"
            class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
            placeholder="Your password"
            required
          />
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input
              type="checkbox"
              class="form-checkbox h-4 w-4 text-purple-600"
            />
            <span class="ml-2 text-gray-700 text-sm">Remember me</span>
          </label>
          <a
            href="#"
            class="inline-block align-baseline font-semibold text-sm text-purple-500 hover:text-purple-800"
          >
            Forgot Password?
          </a>
        </div>
        <button
          type="submit"
          class="w-full py-3 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white font-semibold rounded-full shadow-md focus:outline-none focus:shadow-outline"
        >
          Log In
        </button>
      </form>

      <div class="mt-6 text-center">
        <p class="text-gray-600 text-sm">
          Don't have an account?
          <a
            href="signup.html"
            class="font-semibold text-purple-500 hover:text-purple-800"
            >Sign up</a
          >
        </p>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const loginForm = document.getElementById("login-form");
        const notification = document.getElementById("notification");

        loginForm.addEventListener("submit", function (event) {
          event.preventDefault(); // Prevent default form submission

          // Simulate checking credentials (in a real app, this would be an API call)
          const email = document.getElementById("email").value;
          const password = document.getElementById("password").value;

          console.log("Simulating login with:", { email, password });

          // Show success notification
          notification.textContent =
            "Login successful! Redirecting to main page...";
          notification.classList.add("show");

          // Redirect to the index page after a short delay
          setTimeout(function () {
            window.location.href = "index.html";
            notification.classList.remove("show"); // Optionally hide notification after redirect
          }, 1500);
        });
      });
    </script>
  </body>
</html>
