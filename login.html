<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeNest - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-xl p-8 max-w-md w-full border border-purple-50">
        <!-- Logo and Heading -->
        <div class="flex flex-col items-center mb-6">
            <a href="index.html" class="w-12 h-12 bg-gradient-to-tr from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-md mb-3 hover:scale-105 transition">
                ⏳
            </a>
            <h1 class="text-2xl font-bold text-gray-900">Welcome to TimeNest</h1>
            <p class="text-xs text-gray-500 mt-1">Sign in to book and manage appointments</p>
        </div>

        <!-- Quick 1-Click Demo Logins -->
        <div class="bg-purple-50/90 rounded-2xl p-3.5 mb-6 border border-purple-100">
            <div class="text-[10px] font-bold text-purple-800 uppercase tracking-wider mb-2">⚡ 1-Click Quick Demo Sign In:</div>
            <div class="flex gap-2">
                <button type="button" onclick="fillCredentials('user@timenest.com', 'user123')" class="flex-1 py-1.5 px-2 bg-white text-purple-700 text-xs font-semibold rounded-xl shadow-sm border border-purple-200 hover:bg-purple-50 transition">
                    👤 Demo User
                </button>
                <button type="button" onclick="fillCredentials('admin@timenest.com', 'admin123')" class="flex-1 py-1.5 px-2 bg-white text-indigo-700 text-xs font-semibold rounded-xl shadow-sm border border-indigo-200 hover:bg-indigo-50 transition">
                    ⚡ Administrator
                </button>
            </div>
        </div>

        <!-- Login Form -->
        <form class="space-y-4" id="login-form">
            <div>
                <label for="email" class="block text-gray-700 text-xs font-bold mb-1">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="user@timenest.com"
                    required
                />
            </div>
            <div>
                <label for="password" class="block text-gray-700 text-xs font-bold mb-1">Password *</label>
                <input
                    type="password"
                    id="password"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="••••••••"
                    required
                />
            </div>

            <div class="flex items-center justify-between text-xs">
                <label class="flex items-center text-gray-600">
                    <input type="checkbox" checked class="rounded text-purple-600 focus:ring-purple-400 mr-2" />
                    Remember me
                </label>
                <a href="#" onclick="TimeNestAPI.ui.showToast('Please use demo accounts or sign up', 'info')" class="text-purple-600 hover:underline">Forgot password?</a>
            </div>

            <button
                type="submit"
                id="login-btn"
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-md transition transform active:scale-95 text-xs"
            >
                Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-600 space-y-2">
            <div>
                Don't have an account?
                <a href="signup.html" class="font-bold text-purple-600 hover:underline ml-1">Create an account</a>
            </div>
            <div>
                <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">← Return to Homepage</a>
            </div>
        </div>
    </div>

    <!-- Client Scripts -->
    <script src="js/api.js"></script>
    <script>
        function fillCredentials(email, password) {
            document.getElementById("email").value = email;
            document.getElementById("password").value = password;
        }

        document.getElementById("login-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const btn = document.getElementById("login-btn");

            btn.disabled = true;
            btn.textContent = "Authenticating...";

            try {
                const response = await TimeNestAPI.auth.login(email, password);
                TimeNestAPI.ui.showToast("Login successful! Redirecting...", "success");
                setTimeout(() => {
                    const params = new URLSearchParams(window.location.search);
                    const redirect = params.get('redirect') || 'index.html';
                    window.location.href = redirect;
                }, 800);
            } catch (err) {
                TimeNestAPI.ui.showToast(err.message || "Invalid credentials", "error");
                btn.disabled = false;
                btn.textContent = "Sign In";
            }
        });
    </script>
</body>
</html>
