<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hyper Appointments - Account</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/@tailwindcss/browser@latest"></script>
    <style>
      body {
        font-family: "Inter", sans-serif;
        margin: 0;
        padding: 20px;
        background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        color: #333;
      }
      .account-container {
        background-color: rgba(255, 255, 255, 0.9);
        padding: 30px;
        border-radius: 0.75rem;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        width: 400px;
        max-width: 90%;
      }
      h1 {
        font-size: 2rem;
        font-weight: 700;
        color: #2d3436;
        margin-bottom: 25px;
        text-align: center;
      }
      .account-info {
        margin-bottom: 18px;
        color: #4b5563;
        font-size: 0.95rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .account-info strong {
        font-weight: 600;
        color: #2d3436;
        margin-right: 12px;
        flex-shrink: 0;
      }
      .account-info span {
        flex-grow: 1;
        text-align: right;
      }
      .back-link {
        display: block;
        margin-top: 25px;
        color: #636e72;
        text-decoration: none;
        font-size: 0.9rem;
        transition: color 0.2s ease-in-out;
        text-align: center;
      }
      .back-link:hover {
        color: #2d3436;
      }
    </style>
  </head>
  <body>
    <div class="account-container">
      <h1>Your Account</h1>
      <div class="account-info">
        <strong>Account ID:</strong> <span id="account-id">12345</span>
      </div>
      <div class="account-info">
        <strong>Account Type:</strong> <span id="account-type">Basic</span>
      </div>
      <div class="account-info">
        <strong>Created:</strong> <span id="created-date">January 1, 2020</span>
      </div>
      <a href="index.html" class="back-link">← Back to Home</a>
    </div>
    <script>
      // Simulate fetching account data
      document.addEventListener("DOMContentLoaded", function () {
        const accountData = {
          accountId: "78901",
          accountType: "Premium",
          createdDate: "March 10, 2019",
        };

        document.getElementById("account-id").textContent =
          accountData.accountId;
        document.getElementById("account-type").textContent =
          accountData.accountType;
        document.getElementById("created-date").textContent =
          accountData.createdDate;
      });
    </script>
  </body>
</html>
