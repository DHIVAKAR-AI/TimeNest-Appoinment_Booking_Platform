<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeNest - Create Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">

    <div class="bg-white/95 backdrop-blur-md rounded-3xl shadow-xl p-8 max-w-md w-full border border-purple-50">
        <!-- Logo and Heading -->
        <div class="flex flex-col items-center mb-6">
            <a href="index.html" class="w-12 h-12 bg-gradient-to-tr from-purple-600 to-indigo-600 rounded-2xl flex items-center justify-center text-white text-2xl font-bold shadow-md mb-3 hover:scale-105 transition">
                ⏳
            </a>
            <h1 class="text-2xl font-bold text-gray-900">Create Account</h1>
            <p class="text-xs text-gray-500 mt-1">Join TimeNest for quick, effortless appointment booking</p>
        </div>

        <!-- Signup Form -->
        <form class="space-y-4" id="signup-form">
            <div>
                <label for="fullName" class="block text-gray-700 text-xs font-bold mb-1">Full Name *</label>
                <input
                    type="text"
                    id="fullName"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="John Doe"
                    required
                />
            </div>

            <div>
                <label for="email" class="block text-gray-700 text-xs font-bold mb-1">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="john@example.com"
                    required
                />
            </div>

            <div>
                <label for="phone" class="block text-gray-700 text-xs font-bold mb-1">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="+91 98765 43210"
                />
            </div>

            <div>
                <label for="password" class="block text-gray-700 text-xs font-bold mb-1">Password (min 6 chars) *</label>
                <input
                    type="password"
                    id="password"
                    class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-xs focus:outline-none focus:ring-2 focus:ring-purple-400 bg-white"
                    placeholder="••••••••"
                    minlength="6"
                    required
                />
            </div>

            <button
                type="submit"
                id="signup-btn"
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-700 hover:to-indigo-700 text-white font-semibold rounded-xl shadow-md transition transform active:scale-95 text-xs"
            >
                Register & Sign In
            </button>
        </form>

        <div class="mt-6 text-center text-xs text-gray-600 space-y-2">
            <div>
                Already have an account?
                <a href="login.html" class="font-bold text-purple-600 hover:underline ml-1">Log in</a>
            </div>
            <div>
                <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">← Return to Homepage</a>
            </div>
        </div>
    </div>

    <!-- Client Scripts -->
    <script src="js/api.js"></script>
    <script>
        document.getElementById("signup-form").addEventListener("submit", async function (e) {
            e.preventDefault();

            const fullName = document.getElementById("fullName").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const password = document.getElementById("password").value;
            const btn = document.getElementById("signup-btn");

            btn.disabled = true;
            btn.textContent = "Creating account...";

            try {
                await TimeNestAPI.auth.register(fullName, email, password, phone);
                TimeNestAPI.ui.showToast("Account created successfully! Redirecting...", "success");
                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
            } catch (err) {
                TimeNestAPI.ui.showToast(err.message || "Failed to create account", "error");
                btn.disabled = false;
                btn.textContent = "Register & Sign In";
            }
        });
    </script>
</body>
</html>
