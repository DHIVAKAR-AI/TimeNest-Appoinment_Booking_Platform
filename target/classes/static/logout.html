<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TimeNest - Log Out</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen items-center justify-center p-4">
    <div class="bg-white/95 rounded-3xl p-8 max-w-sm w-full text-center shadow-xl border border-purple-50">
        <div class="w-16 h-16 bg-purple-100 text-purple-600 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
            👋
        </div>
        <h2 class="text-xl font-bold text-gray-900">Signed Out Successfully</h2>
        <p class="text-xs text-gray-500 mt-1.5 leading-relaxed">You have been logged out of your TimeNest session. Thank you for using TimeNest!</p>
        
        <div class="mt-6 flex flex-col gap-2.5">
            <a href="login.html" class="inline-block w-full py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 text-white font-semibold rounded-xl text-xs shadow hover:from-purple-700 hover:to-indigo-700 transition">
                Sign In Again
            </a>
            <a href="index.html" class="inline-block w-full py-2.5 bg-gray-50 hover:bg-gray-100 text-gray-700 font-semibold rounded-xl text-xs transition">
                Return to Homepage
            </a>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        localStorage.removeItem('timenest_user');
        localStorage.removeItem('timenest_token');
    </script>
</body>
</html>
