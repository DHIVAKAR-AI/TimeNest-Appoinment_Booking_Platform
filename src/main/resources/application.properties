# ===================================================================
# TimeNest - Appointment Booking Platform Configuration
# ===================================================================

server.port=${PORT:8081}
spring.application.name=timenest-platform

# -------------------------------------------------------------------
# Database Configuration (Default: H2 In-Memory with persistence)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:timenestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Console (Available at http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# -------------------------------------------------------------------
# Hibernate / JPA Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

# -------------------------------------------------------------------
# Static Resource & Web Configuration
# -------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.root=INFO
logging.level.com.timenest=DEBUG
logging.level.org.springframework.security=WARN

